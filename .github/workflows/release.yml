name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    # Läuft 1x täglich um 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  linter:
    strategy:
      fail-fast: true
    runs-on: "ubuntu-latest"
    environment: Production

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run linter
        run: |
          python3 --version
          ./tests/linter

  python-tests:
    needs: [linter]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ['3.10', '3.12', '3.14', '3.x']
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
      - name: Run unit tests with coverage
        shell: bash
        run: |
          python -m pytest \
            -m "not integration" \
            --cov=asanai \
            --cov-report=term-missing \
            --cov-report=markdown:coverage.md \
            --cov-report=json:coverage.json \
            --cov-fail-under=95 | tee coverage-term.txt
      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Coverage — ${{ matrix.os }} / Python ${{ matrix.python-version }}"
            echo
            echo "### pytest output"
            echo '```'
            cat coverage-term.txt 2>/dev/null || true
            echo '```'
            if [ -f coverage.md ]; then
              echo
              echo "### Coverage table"
              cat coverage.md
            fi
            if [ -f coverage.json ]; then
              echo
              echo "### Uncovered lines per file"
              python tests/coverage_summary.py coverage.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    needs: [linter]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TensorFlow and tensorflowjs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
          python -m pip install "tensorflow==2.16.1" "tensorflowjs==4.22.0" "setuptools<81"
      - name: Run real model conversion test
        run: |
          python -m pytest -q -m integration

  version-tagging:
    needs: [integration, python-tests]
    strategy:
      fail-fast: true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: Production
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Create a new version
        if: ${{ success() }}
        run: |
          echo "Creating new version"
          git tag ${{ github.run_number }} || true
          git push origin --tags || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-pypi:
    needs: [integration, python-tests]
    permissions:
      contents: read
    environment: Production
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools
      - name: Creating pyproject.toml
        run: |
          bash tests/create_pyproject_toml ${{ github.run_number }}
      - name: Build package
        run: |
          python -m build
          cp -r dist ..
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
